
name: Deploy TutorConnect

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:

  # 1. Build the React application
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build React application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  # 2. Deploy Supabase database and Edge Functions
  deploy-supabase:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Use the CLI from npm instead of supabase/setup-cli: setup-cli resolves
      # "latest" through the GitHub API, which is rate limited on shared runners.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Use the IPv4-compatible session pooler
      # to avoid IPv6 connectivity issues.
      - name: Apply database migrations
        run: |
          npx --yes supabase@latest db push \
            --remote="$SUPABASE_DB_URL" \
            --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      # Deploy Edge Functions
      - name: Deploy Google Calendar Edge Functions
        run: |
          npx --yes supabase@latest functions deploy google-auth-start --project-ref "$SUPABASE_PROJECT_REF" --yes
          npx --yes supabase@latest functions deploy google-oauth-callback --project-ref "$SUPABASE_PROJECT_REF" --yes
          npx --yes supabase@latest functions deploy google-calendar-status --project-ref "$SUPABASE_PROJECT_REF" --yes
          npx --yes supabase@latest functions deploy create-class --project-ref "$SUPABASE_PROJECT_REF" --yes
          npx --yes supabase@latest functions deploy upload-file --project-ref "$SUPABASE_PROJECT_REF" --yes
          npx --yes supabase@latest functions deploy download-file --project-ref "$SUPABASE_PROJECT_REF" --yes
          npx --yes supabase@latest functions deploy manage --project-ref "$SUPABASE_PROJECT_REF" --yes
          npx --yes supabase@latest functions deploy send-notification --project-ref "$SUPABASE_PROJECT_REF" --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

  # 3. Deploy website to GitHub Pages
  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4